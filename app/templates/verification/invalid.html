<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Notice - Invoice Not Found</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <style>
    body {
      background-color: #F8F9FA;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .invalid-card {
      background-color: #FFFFFF;
      border: 1px solid #FECACA;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      max-width: 460px;
      width: 100%;
      padding: 32px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="invalid-card">
    <div style="width: 48px; height: 48px; background-color: #FEF2F2; color: #DC2626; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
    </div>
    <h1 style="font-size: 18px; font-weight: 700; color: #991B1B; margin-bottom: 8px;">Invalid Verification Link</h1>
    <p style="font-size: 13px; color: #4B5563; line-height: 1.5; margin-bottom: 20px;">
      The invoice verification token provided is invalid, has expired, or the invoice reference <strong>{{ invoice_number }}</strong> could not be authenticated.
    </p>
    <div style="font-size: 11px; color: #9CA3AF;">
      Please contact the issuing freelancer or company for an updated billing document.
    </div>
  </div>
</body>
</html>
